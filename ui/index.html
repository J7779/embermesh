<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  Strict CSP. No external origins at all. 'wasm-unsafe-eval' lets the WebAssembly core compile;
  ws:/wss: allow the hub mesh socket and desktop-daemon RPC; blob:/data: cover generated downloads.
  WebRTC data channels are not governed by connect-src. A single-file build that inlines scripts
  must replace 'self' in script-src with the inlined scripts' sha256 hashes.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob: data:; connect-src 'self' ws: wss: blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#17110f">
<title>EmberMesh</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23ff8a3d%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/a11y.css">
<link rel="stylesheet" href="css/boot.css">
<script type="module" src="js/boot/boot.js" async></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app">
  <div id="strip"></div>
  <main id="main" tabindex="-1"><div class="loading" id="boot">Starting EmberMesh…</div></main>
  <nav id="nav" aria-label="Main"></nav>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div id="ember-boot" aria-hidden="true">
  <!-- Start-up screen, first frame (static; js/boot/ animates it). Geometry = docs/assets/logo.svg. -->
  <svg class="eb-logo" viewBox="0 0 128 128" width="128" height="128" focusable="false">
    <defs>
      <linearGradient id="eb-flame" x1="0" y1="1" x2="0" y2="0"><stop class="eb-f0" offset="0" stop-color="#e8471c"/><stop class="eb-f1" offset="0.6" stop-color="#ff8a3d"/><stop class="eb-f2" offset="1" stop-color="#ffc861"/></linearGradient>
      <linearGradient id="eb-core" x1="0" y1="1" x2="0" y2="0"><stop class="eb-c0" offset="0" stop-color="#ffd27a"/><stop class="eb-c1" offset="1" stop-color="#fff4d6"/></linearGradient>
    </defs>
    <g class="eb-l" stroke="#ff8a3d" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" fill="none"><path d="M64 14 L107 39 L107 89 L64 114 L21 89 L21 39 Z M64 14 L64 34 M107 39 L88 50 M107 89 L88 78 M64 114 L64 98 M21 89 L40 78 M21 39 L40 50"/></g>
    <g class="eb-n" fill="#ffb35c"><circle cx="64" cy="14" r="5.5"/><circle cx="107" cy="39" r="5.5"/><circle cx="107" cy="89" r="5.5"/><circle cx="64" cy="114" r="5.5"/><circle cx="21" cy="89" r="5.5"/><circle cx="21" cy="39" r="5.5"/></g>
    <path fill="url(#eb-flame)" d="M64 30 C73 44 88 55 88 75 C88 90 77 100 64 100 C51 100 40 90 40 75 C40 63 47 55 52 46 C54 55 58 60 63 62 C60 52 60 40 64 30 Z"/>
    <path fill="url(#eb-core)" d="M64 62 C70 70 76 76 76 84 C76 92 70 97 64 97 C58 97 52 92 52 84 C52 78 56 74 59 70 C60 75 62 77 64 78 C63 72 62 67 64 62 Z"/>
  </svg>
  <div class="eb-word">Ember<span>Mesh</span></div>
</div>
<p class="eb-sr" id="ember-boot-status" role="status" aria-live="polite"></p>
<noscript><p>EmberMesh needs JavaScript enabled.</p></noscript>
</body>
</html>
