  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="330" y="160" font-size="84" font-weight="700" fill="#fff4e8" letter-spacing="-1">Ember<tspan fill="#ff8a3d">Mesh</tspan></text>
    <text x="334" y="210" font-size="27" fill="#e9cdb8">Off-grid mesh chat and an offline survival library</text>
    <text x="334" y="250" font-size="20" fill="#b89a86">radios · LoRa · Bluetooth · Wi-Fi · USB stick · QR code · Morse</text>
