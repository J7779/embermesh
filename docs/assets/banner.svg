<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="EmberMesh: off-grid mesh chat and an offline survival library">
  <title>EmberMesh</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d0b"/>
      <stop offset="1" stop-color="#2a1610"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e8471c"/>
      <stop offset="0.6" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc861"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#fff4d6"/>
