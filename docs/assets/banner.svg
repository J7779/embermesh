  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>
  <!-- background mesh -->
  <g stroke="#ff8a3d" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M760 40 L860 90 L980 50 L1100 110 L1220 60 M860 90 L900 190 L1020 230 L1100 110 M900 190 L800 260 L700 220 L760 40 M1020 230 L1160 250 L1220 160 L1100 110 M1220 160 L1220 60 M800 260 L960 290 L1020 230 M700 220 L620 290"/>
