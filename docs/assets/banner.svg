    <circle cx="1100" cy="110" r="6"/><circle cx="1220" cy="60" r="4"/><circle cx="900" cy="190" r="5"/>
    <circle cx="1020" cy="230" r="5"/><circle cx="800" cy="260" r="4"/><circle cx="700" cy="220" r="4"/>
    <circle cx="1160" cy="250" r="4"/><circle cx="1220" cy="160" r="5"/><circle cx="960" cy="290" r="3"/>
    <circle cx="620" cy="290" r="3"/>
