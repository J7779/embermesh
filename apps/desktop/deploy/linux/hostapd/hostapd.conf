# hostapd config for an EmberMesh hub hotspot (installed to /etc/hostapd/hostapd.conf by
# setup-hostapd.sh). Open network by default; uncomment the WPA2 block to require a password.
interface=wlan0
driver=nl80211
ssid=EmberMesh
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
ignore_broadcast_ssid=0
macaddr_acl=0
# Set your regulatory domain (affects legal channels / power).
country_code=US

# --- WPA2 (optional) ---
#wpa=2
#wpa_key_mgmt=WPA-PSK
#rsn_pairwise=CCMP
#wpa_passphrase=<choose your own, 8-63 characters; setup-hostapd.sh --password fills this in>
