# dnsmasq config for the EmberMesh hotspot (installed to /etc/dnsmasq.d/embermesh.conf).
# DHCP for wlan0 clients; the hub itself is 10.42.0.1.
interface=wlan0
bind-interfaces
dhcp-range=10.42.0.10,10.42.0.200,255.255.255.0,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
# A friendly name for the hub: guests can open http://ember.mesh:8437/
address=/ember.mesh/10.42.0.1
domain-needed
bogus-priv
no-resolv

# --- Optional captive-portal-like behaviour ---
# Resolve EVERY name to the hub so phones' connectivity checks reach emberd; requires
# "captive_portal": true in emberd.json and a port-80 redirect, e.g.
#   iptables -t nat -A PREROUTING -i wlan0 -p tcp --dport 80 -j REDIRECT --to-ports 8437
#address=/#/10.42.0.1
