name: Desktop

# Host library (host/) + the desktop daemon emberd (apps/desktop/) with their CTest suites (core
# doctest, ember_host_tests, emberd_tests and, on POSIX, the multi-process emberd_mesh scenarios).
# POSIX runners use ./build.sh exactly as a developer does; Windows uses build.ps1 (MSVC).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build-test:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: macos-arm64, os: macos-15 }
          - { platform: macos-x86_64, os: macos-15-intel }
          - { platform: windows-x86_64, os: windows-2025 }
    env:
      EMBER_TEST_RESULTS: build/test-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          mkdir -p build/ci-logs
          { uname -a; cmake --version | head -1; command -v c++ >/dev/null && c++ --version | head -1 || true; } | tee build/ci-logs/toolchain.txt

      - name: Build emberd and run the native suites (build.sh)
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          ./build.sh desktop test --only native --strict 2>&1 | tee build/ci-logs/desktop.log

      - name: Build emberd and run the native suites (build.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./build.ps1 desktop test *>&1 | Tee-Object -FilePath build/ci-logs/desktop.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test the binary
        run: |
          exe=dist/desktop/emberd; [ "$RUNNER_OS" = Windows ] && exe=dist/desktop/emberd.exe
          "$exe" --version
          "$exe" --help > build/ci-logs/emberd-help.txt 2>&1

      - name: Summary
        if: always()
        run: |
          py() { if python3 -c '' >/dev/null 2>&1; then python3 "$@"; else python "$@"; fi; }   # Windows: python
          {
            echo "### Desktop: ${{ matrix.platform }} (${{ matrix.os }})"
            echo
            sed 's/^/    /' build/ci-logs/toolchain.txt 2>/dev/null || true
            echo
            py tools/ci/report.py tests-header
            py tools/ci/report.py tests ctest "ctest: core + host + emberd" build/test-results/ctest.xml
            echo
            echo "Built (artifact \`emberd-${{ matrix.platform }}\`):"
            echo
            py tools/ci/report.py files dist/desktop/emberd dist/desktop/emberd.exe dist/desktop/guides.pack
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload emberd
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emberd-${{ matrix.platform }}
          path: |
            dist/desktop/emberd
            dist/desktop/emberd.exe
          retention-days: 14
          if-no-files-found: error

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-results-${{ matrix.platform }}
          path: |
            build/test-results/
            build/ci-logs/
            build/host/Testing/Temporary/LastTest.log
          retention-days: 14
          if-no-files-found: warn

  summary:
    name: Desktop summary
    if: always()
    needs: [build-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/needs-summary.py "Desktop"
