name: Pages

# Hosts the web app on GitHub Pages (https://<owner>.github.io/<repository>/) from every main
# commit whose Web workflow succeeded. The site deployed is exactly the dist/web the Web workflow
# built and tested (artifact web-dist-linux of that run: UI + WASM core + data/guides.pack + PWA
# manifest/service worker + the single-file embermesh.html as a download); it is not rebuilt here.
# Before deploying, this workflow checks that every URL in the site is relative (the app lives
# under a sub-path), checks the Pages size limits, and runs the UI smoke walk against the site
# served from a sub-directory, as Pages will serve it.
#
# One-time setup by a repository admin: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". This workflow cannot change that setting itself.

on:
  workflow_run:
    workflows: [Web]
    types: [completed]
    branches: [main]
  workflow_dispatch:   # redeploy the newest successful Web run of main

permissions:
  contents: read

# Deployments are serialised and an in-progress deployment is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Prepare the tested site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.src.outputs.sha }}
    steps:
      - name: Which Web run
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$RUN_ID" ]; then
            read -r RUN_ID RUN_SHA < <(gh run list --workflow web.yml --branch main --event push --status success --limit 1 \
              --json databaseId,headSha --jq '.[0] | "\(.databaseId) \(.headSha)"')
          fi
          [ -n "$RUN_ID" ] && [ "$RUN_ID" != null ] || { echo "::error::no successful Web run on main to deploy"; exit 1; }
          echo "run=$RUN_ID" >> "$GITHUB_OUTPUT"; echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying the site built and tested by Web run $RUN_ID (commit $RUN_SHA)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.src.outputs.sha }}
          persist-credentials: false

      - name: Download the tested web app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist-linux
          path: build/site
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ github.token }}

      - name: Relative URLs, .nojekyll, Pages limits
        run: |
          touch build/site/.nojekyll   # serve files and folders starting with "_" as they are
          python3 tools/ci/check-relative-urls.py build/site
          python3 tools/ci/pages-limits.py build/site >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: UI smoke walk against the site under a sub-path
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          CHROME: /usr/bin/google-chrome
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          mkdir -p build/pages-root build/ci-logs
          cp -R build/site "build/pages-root/$REPO_NAME"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory build/pages-root > build/ci-logs/http.log 2>&1 &
          for _ in $(seq 1 50); do curl -fsS -o /dev/null "http://127.0.0.1:8765/$REPO_NAME/" && break; sleep 0.2; done
          set -o pipefail
          node ui/tests/smoke_chrome.mjs --real "http://127.0.0.1:8765/$REPO_NAME/" 2>&1 | tee build/ci-logs/pages-smoke.log

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
          include-hidden-files: true
          retention-days: 7

      - name: Setup hint
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          {
            echo "### Pages is not enabled for this repository"
            echo
            echo "A repository admin must set **Settings → Pages → Build and deployment → Source** to **GitHub Actions** once,"
            echo "then re-run this workflow (Actions → Pages → Run workflow). The workflow cannot change that setting itself."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-smoke-log
          path: build/ci-logs/
          retention-days: 14
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Summary
        if: always()
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          if [ -n "$PAGE_URL" ]; then
            {
              echo "### Deployed"
              echo
              echo "**$PAGE_URL** (commit \`${SHA:0:12}\`)"
              echo
              echo "Single file to share offline: ${PAGE_URL}embermesh.html"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Deployment failed"
              echo
              echo "If this is the first run: a repository admin must set **Settings → Pages → Source** to **GitHub Actions**, then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
