name: Publish checks

# The publishing gate and repository hygiene:
#   - tools/check-publishable.sh and its --self-test. On CI it runs in --ci mode (automatic with
#     CI=true): identifiers discovered on the runner itself ("runner", its host name...) are generic
#     words, so that one rule is skipped; every generic rule stays on.
#   - licences: the project LICENSE, every vendored component's licence, guide sources/licences
#   - required files are present and not git-ignored; pinned toolchain versions match the builds
#   - actionlint on the workflows, shellcheck on the scripts, a PowerShell parse of the .ps1 files,
#     and the unit tests of the CI helper scripts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: 0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  gate:
    name: Publishing gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gate self-test (one planted violation per rule, --ci mode)
        run: |
          mkdir -p build/ci-logs
          set -o pipefail
          bash tools/check-publishable.sh --self-test 2>&1 | tee build/ci-logs/gate-self-test.log
      - name: Gate over the repository (build.sh privacy)
        id: gate
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          ./build.sh privacy 2>&1 | tee build/ci-logs/gate.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### Publishing gate"
            echo
            echo '```'
            grep -E 'self-test (passed|FAILED)' build/ci-logs/gate-self-test.log || echo "self-test: no result"
            sed -n '/^Publishability check/,$p' build/ci-logs/gate.log
            echo '```'
            if grep -q '^FAIL' build/ci-logs/gate.log; then
              echo
              echo "<details><summary>Findings</summary>"
              echo
              echo '```'
              grep -E '^(FAIL|WARN)' build/ci-logs/gate.log | head -300
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish-gate-logs
          path: build/ci-logs/
          retention-days: 14

  licences:
    name: Licences and attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Project, third-party and guide licences
        run: tools/ci/check-licences.sh

  repository:
    name: Required files and pinned versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Required files are present and not git-ignored
        run: tools/ci/check-required-files.sh
      - name: Toolchain pins match the build files; actions pinned to commit SHAs
        if: ${{ !cancelled() }}
        run: tools/ci/check-pins.sh
      - name: Summary
        if: always()
        run: |
          {
            echo "### Repository"
            echo
            echo '```'
            tools/ci/check-required-files.sh 2>&1 | tail -20 || true
            tools/ci/check-pins.sh 2>&1 | tail -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: actionlint, shellcheck, PowerShell, CI helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint and shellcheck (pinned, checksum-verified)
        run: |
          d="$RUNNER_TEMP/lint-tools"; mkdir -p "$d/bin"; cd "$d"
          curl -fsSL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          curl -fsSL -o shellcheck.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          mv "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" bin/
          echo "$d/bin" >> "$GITHUB_PATH"
      - name: actionlint (workflows, with shellcheck on run blocks)
        run: actionlint -color -shellcheck "$(command -v shellcheck)"
      - name: shellcheck (every shell script in the repository)
        if: ${{ !cancelled() }}
        run: |
          git ls-files -co --exclude-standard -z -- '*.sh' 'apps/android/gradlew' | xargs -0 shellcheck -S warning -f gcc
      - name: PowerShell scripts parse
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in (git ls-files -co --exclude-standard -- '*.ps1')) {
            $tokens = $null; $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errs) | Out-Null
            foreach ($e in $errs) { Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad++ }
            Write-Host "$f parsed ($($errs.Count) errors)"
          }
          if ($bad -gt 0) { exit 1 }
      - name: CI helper unit tests
        if: ${{ !cancelled() }}
        run: |
          python3 -m py_compile tools/ci/*.py
          python3 -m unittest discover -s tools/ci/tests -v

  summary:
    name: Publish checks summary
    if: always()
    needs: [gate, licences, repository, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/needs-summary.py "Publish checks"
