name: Release

# Builds every distributable and publishes it:
#   - every push to main: the rolling development release "latest" (tag `latest`, replaced each time).
#     Until a versioned release exists it is the repository's latest release, so the repository page
#     and /releases/latest show it; after that it is marked pre-release and vX.Y.Z stays the latest.
#   - a version tag vX.Y.Z: a normal release for that tag (the tag must match project() VERSION)
# All files are also attached to the workflow run as artifacts. No iOS artifacts (Apple signing).
# The release is created with the run's own GITHUB_TOKEN. The only optional secrets are the Android
# release key (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD; docs/CI.md "Release signing"): without them the release APK is signed with a
# throw-away key and named *-release-ci-debug-signed.apk.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# One group per commit: a release build is never cancelled by a newer one. Publishing is
# serialised separately (publish job), and only the newest main commit replaces "latest".
concurrency:
  group: release-${{ github.sha }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
      epoch: ${{ steps.v.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          base="$(sed -n 's/^project(EmberMesh VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          [ -n "$base" ] || { echo "::error::no project(EmberMesh VERSION x.y.z) in CMakeLists.txt"; exit 1; }
          if [ "$REF_TYPE" = tag ]; then
            tag="${REF_NAME#v}"
            if [ "$tag" != "$base" ] && [ "${tag%%-*}" != "$base" ]; then
              echo "::error::tag $REF_NAME does not match project(EmberMesh VERSION $base) in CMakeLists.txt"; exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"; echo "kind=tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=$base-dev.$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"; echo "kind=rolling" >> "$GITHUB_OUTPUT"
          fi
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

  guides:
    name: guides.pack
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build guides.pack (build.sh)
        run: ./build.sh guides
      - name: Summary
        run: |
          { echo "### guides.pack"; echo; python3 tools/ci/report.py files build/guides.pack; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-guides
          path: build/guides.pack
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  web:
    name: Web app
    needs: [version, guides]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: ./.github/actions/setup-emsdk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-guides
          path: build/release-in
      - name: Build the web app with the guide library (build.sh)
        run: |
          ./build.sh web
          # build.sh packs the library again: it must be byte-identical to the released guides.pack.
          cmp build/guides.pack build/release-in/guides.pack
      - name: Single file with the library inlined
        run: |
          node apps/web/tools/package.mjs --wasm build/web/wasm --out build/web-inline --guides build/guides.pack --inline-guides
          test -s build/web-inline/embermesh.html
      - name: Package
        run: |
          mkdir -p build/release
          python3 tools/ci/package.py web --version "$VERSION" --web dist/web --out build/release
          cp dist/web/embermesh.html build/release/embermesh.html
          cp build/web-inline/embermesh.html build/release/embermesh-with-library.html
          # The inlined file is about 1.34 x the pack; GitHub release assets may be up to 2 GiB.
          size="$(wc -c < build/release/embermesh-with-library.html)"
          if [ "$size" -gt 1900000000 ]; then echo "::warning::embermesh-with-library.html is $size bytes, too large for a release asset; dropped"; rm build/release/embermesh-with-library.html; fi
          { echo "### Web app $VERSION"; echo; python3 tools/ci/report.py files build/release; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the web app (for the desktop and Android packages)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web-dist
          path: dist/web/
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: build/release/
          retention-days: 30
          if-no-files-found: error

  desktop:
    name: emberd ${{ matrix.platform }}
    needs: [version, guides, web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-24.04 }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
          - { platform: macos-arm64, os: macos-15 }
          - { platform: macos-x86_64, os: macos-15-intel }
          - { platform: windows-x86_64, os: windows-2025 }
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build emberd (build.sh)
        if: runner.os != 'Windows'
        run: ./build.sh desktop --no-guides
      - name: Build emberd (build.ps1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build.ps1 desktop -NoGuides
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-guides
          path: build/release-in
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-web-dist
          path: build/release-in/web
      - name: Smoke test and package
        run: |
          py() { if python3 -c '' >/dev/null 2>&1; then python3 "$@"; else python "$@"; fi; }   # Windows: python
          exe=dist/desktop/emberd; [ "$RUNNER_OS" = Windows ] && exe=dist/desktop/emberd.exe
          "$exe" --version
          mkdir -p build/release
          py tools/ci/package.py desktop --platform "${{ matrix.platform }}" --version "$VERSION" \
            --emberd "$exe" --web build/release-in/web --guides build/release-in/guides.pack --out build/release
          { echo "### emberd ${{ matrix.platform }}"; echo; py tools/ci/report.py files build/release; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-emberd-${{ matrix.platform }}
          path: build/release/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  android:
    name: Android APKs
    needs: [version, guides, web]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    outputs:
      signer: ${{ steps.key.outputs.present == 'true' && 'release' || 'ci-debug' }}
      cert: ${{ steps.verify.outputs.cert_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          cache-read-only: 'true'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-guides
          path: build
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-web-dist
          path: dist/web
      - name: Release signing key (repository secrets; main and version tags only)
        id: key
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: tools/ci/android-signing.sh prepare
      - name: Debug and release APKs (hub serves the web build; guides.pack bundled)
        working-directory: apps/android
        env:
          EMBER_ANDROID_KEYSTORE: ${{ steps.key.outputs.present == 'true' && steps.key.outputs.keystore || '' }}
          EMBER_ANDROID_KEYSTORE_PASSWORD: ${{ steps.key.outputs.present == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          EMBER_ANDROID_KEY_ALIAS: ${{ steps.key.outputs.present == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          EMBER_ANDROID_KEY_PASSWORD: ${{ steps.key.outputs.present == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --console=plain -PemberGuidesPack="$GITHUB_WORKSPACE/build/guides.pack" -PemberWebDir="$GITHUB_WORKSPACE/dist/web"
      - name: Remove the release signing key
        if: always()
        run: tools/ci/android-signing.sh cleanup
      - name: Collect
        env:
          RELEASE_KEY: ${{ steps.key.outputs.present == 'true' }}
        run: |
          mkdir -p build/release
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk "build/release/embermesh-$VERSION-android-debug.apk"
          release="embermesh-$VERSION-android-release-ci-debug-signed.apk"
          [ "$RELEASE_KEY" = true ] && release="embermesh-$VERSION-android-release.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "build/release/$release"
          echo "RELEASE_APK=build/release/$release" >> "$GITHUB_ENV"
      - name: Verify the signing certificate
        id: verify
        env:
          RELEASE_KEY: ${{ steps.key.outputs.present == 'true' }}
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          {
            echo "### Android $VERSION"
            echo
            if [ "$RELEASE_KEY" = true ]; then
              echo "Release APK signed with the **project release key** (repository secrets)."
            else
              echo "Release APK signed with the runner's **throw-away debug key** (no release key in this run)."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$RELEASE_KEY" != true ] && [ -n "$EXPECTED_CERT" ]; then
            echo "::error::ANDROID_CERT_SHA256 is set but the release key secrets are missing: refusing to release an APK signed with a throw-away key"
            exit 1
          fi
          expected=""; [ "$RELEASE_KEY" = true ] && expected="$EXPECTED_CERT"
          tools/ci/android-signing.sh verify "$RELEASE_APK" "$expected" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo; python3 tools/ci/report.py files build/release; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: build/release/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish ${{ needs.version.outputs.kind == 'tag' && 'release' || 'rolling release "latest"' }}
    needs: [version, guides, web, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      SOURCE_DATE_EPOCH: ${{ needs.version.outputs.epoch }}
      ANDROID_SIGNER: ${{ needs.android.outputs.signer }}
      ANDROID_CERT: ${{ needs.android.outputs.cert }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: build/artifacts
      - name: Assemble the release files
        run: |
          mkdir -p build/out
          find build/artifacts -mindepth 2 -maxdepth 2 -type f \
            \( -path '*/release-web/*' -o -path '*/release-emberd-*/*' -o -path '*/release-android/*' \) -exec cp {} build/out/ \;
          cp build/artifacts/release-guides/guides.pack build/out/guides.pack
          ls -l build/out
          {
            echo "Emscripten 6.0.13 (WebAssembly)"
            echo "Android: JDK 21, NDK 27.1.12297006, SDK platform 37, SDK CMake 3.22.1"
            echo "Runners: ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025 (MSVC)"
          } > build/toolchains.txt
          python3 tools/ci/release-notes.py --dir build/out --version "$VERSION" --kind "$KIND" \
            --toolchains build/toolchains.txt --android-signer "$ANDROID_SIGNER" --android-cert "$ANDROID_CERT" \
            --out-notes build/notes.md
          cat build/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload everything as one artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embermesh-${{ needs.version.outputs.version }}
          path: build/out/
          retention-days: 30
          compression-level: 0

      - name: Publish the rolling release "latest"
        if: needs.version.outputs.kind == 'rolling' && github.ref == 'refs/heads/main'
        run: |
          # Only the newest commit on main may replace "latest" (an older run that finishes late does not).
          head="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main has moved on to $head; not replacing \"latest\" with $GITHUB_SHA (artifacts are attached to this run)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # A development build is the repository's latest release only while no versioned release exists.
          versioned="$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | startswith("v"))) | .tag_name')"
          if [ -n "$versioned" ]; then mark=(--prerelease --latest=false); else mark=(--latest); fi
          gh release delete latest --cleanup-tag --yes 2>/dev/null || true
          gh release create latest build/out/* --target "$GITHUB_SHA" "${mark[@]}" \
            --title "latest (main, ${GITHUB_SHA:0:8})" --notes-file build/notes.md
          echo "Published: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/latest" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the versioned release
        if: needs.version.outputs.kind == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac   # v1.2.0-rc.1 -> pre-release
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/out/* --clobber
            gh release edit "$TAG" --notes-file build/notes.md
          else
            gh release create "$TAG" build/out/* --verify-tag --title "EmberMesh $VERSION" --notes-file build/notes.md "${prerelease[@]}"
          fi
          # From the first versioned release on, the rolling development build is a pre-release.
          if [ "${#prerelease[@]}" -eq 0 ]; then
            gh release edit latest --prerelease 2>/dev/null || true
          fi
          echo "Published: $GITHUB_SERVER_URL/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Release summary
    if: always()
    needs: [version, guides, web, desktop, android, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci
      - name: Required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 tools/ci/needs-summary.py "Release"
